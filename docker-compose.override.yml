x-local-app-environment: &local-app-environment
  APP_ENV: "local"
  APP_DEBUG: "true"
  APP_URL: "http://${DOCKER_APP_HOST:-webguard.test}"
  MARKETING_URL: "${MARKETING_URL:-http://localhost:4321}"
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_DATABASE: "webguard_core"
  DB_USERNAME: "webguard"
  DB_PASSWORD: "webguard"
  CACHE_STORE: "redis"
  QUEUE_CONNECTION: "redis"
  REDIS_CLIENT: "phpredis"
  REDIS_HOST: "redis"
  REDIS_PASSWORD: "null"
  REDIS_PORT: "6379"
  MAIL_MAILER: "smtp"
  MAIL_HOST: "mailpit"
  MAIL_PORT: "1025"
  MAIL_USERNAME: "null"
  MAIL_PASSWORD: "null"

services:
  traefik:
    container_name: webguard-traefik
    image: traefik:latest
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
    ports:
      - "${DOCKER_HTTP_PORT:-80}:80"
      - "${DOCKER_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      webguard-network:
        aliases:
          - "${DOCKER_APP_HOST:-webguard.test}"

  mailpit:
    container_name: webguard-mailpit
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${DOCKER_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${DOCKER_MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - webguard-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailpit.rule=Host(`${DOCKER_MAILPIT_HOST:-mailpit.webguard.test}`)
      - traefik.http.routers.mailpit.entrypoints=http
      - traefik.http.services.mailpit.loadbalancer.server.port=8025
      - traefik.http.routers.mailpit-secure.rule=Host(`${DOCKER_MAILPIT_HOST:-mailpit.webguard.test}`)
      - traefik.http.routers.mailpit-secure.entrypoints=https
      - traefik.http.routers.mailpit-secure.tls=true

  php:
    build:
      context: .
      target: development
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    volumes:
      - ./:/var/www/html
    environment:
      <<: *local-app-environment
      AUTORUN_DEBUG: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    container_name: webguard-frontend
    build:
      context: .
      target: sveltekit_production
    environment:
      ORIGIN: "http://${DOCKER_APP_HOST:-webguard.test}"

  gateway:
    labels:
      - traefik.enable=true
      - traefik.http.routers.webguard.rule=Host(`${DOCKER_APP_HOST:-webguard.test}`)
      - traefik.http.routers.webguard.entrypoints=http
      - traefik.http.services.webguard.loadbalancer.server.port=8080
      - traefik.http.routers.webguard-secure.rule=Host(`${DOCKER_APP_HOST:-webguard.test}`)
      - traefik.http.routers.webguard-secure.entrypoints=https
      - traefik.http.routers.webguard-secure.tls=true

  schedule:
    volumes:
      - ./:/var/www/html
    environment:
      <<: *local-app-environment

  queue-default:
    volumes:
      - ./:/var/www/html
    environment:
      <<: *local-app-environment

  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "webguard_core"
      MYSQL_USER: "webguard"
      MYSQL_PASSWORD: "webguard"
    ports:
      - "${DOCKER_MYSQL_PORT:-3306}:3306"
