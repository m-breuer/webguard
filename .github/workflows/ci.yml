name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
    - '**'

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI_IMAGE: webguard-ci:${{ github.run_id }}
  PHP_OPCACHE_ENABLE: "1"
  PHP_MEMORY_LIMIT: "2048M"
  PHP_MAX_EXECUTION_TIME: "300"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build CI image
      uses: docker/build-push-action@v6
      with:
        context: .
        target: ci
        tags: ${{ env.CI_IMAGE }}
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Cache Composer dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/composer/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install PHP dependencies
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -e COMPOSER_CACHE_DIR=/tmp/composer-cache \
          -e PHP_OPCACHE_ENABLE -e PHP_MEMORY_LIMIT -e PHP_MAX_EXECUTION_TIME \
          -v "${{ github.workspace }}:/var/www/html" \
          -v "$HOME/.cache/composer/files:/tmp/composer-cache" \
          -w /var/www/html "${{ env.CI_IMAGE }}" \
          composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.11'

    - name: Cache Bun dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install frontend dependencies
      run: bun install --frozen-lockfile

    - name: Run Rector
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -e PHP_OPCACHE_ENABLE -e PHP_MEMORY_LIMIT -e PHP_MAX_EXECUTION_TIME \
          -v "${{ github.workspace }}:/var/www/html" \
          -w /var/www/html "${{ env.CI_IMAGE }}" \
          ./vendor/bin/rector process --ansi

    - name: Run Pint
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -e PHP_OPCACHE_ENABLE -e PHP_MEMORY_LIMIT -e PHP_MAX_EXECUTION_TIME \
          -v "${{ github.workspace }}:/var/www/html" \
          -w /var/www/html "${{ env.CI_IMAGE }}" \
          ./vendor/bin/pint --parallel

    - name: Ensure writable branch exists
      if: >
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      env:
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      run: git checkout -B "$BRANCH_NAME"

    - name: Commit auto-fixes (internal branches only)
      if: >
        (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: 'ci: auto-fixes from pint and rector'
        commit_options: '--no-verify'
        branch: ${{ github.head_ref || github.ref_name }}

    - name: Fail if Rector or Pint would change files
      if: >
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
      run: |
        if ! git diff --quiet; then
          echo "::error::Rector and/or Pint changed tracked files. The branch must be optimized before it can pass CI."
          git diff
          exit 1
        fi

    - name: Build frontend assets
      run: |
        bun run build
        bun run frontend:check
        bun run frontend:build
        bun run --cwd frontend budget

    - name: Run PHPStan
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -e PHP_OPCACHE_ENABLE -e PHP_MEMORY_LIMIT -e PHP_MAX_EXECUTION_TIME \
          -v "${{ github.workspace }}:/var/www/html" \
          -w /var/www/html "${{ env.CI_IMAGE }}" \
          composer analyse

    - name: Run tests with coverage
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ':memory:'
        XDEBUG_MODE: coverage
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -e DB_CONNECTION \
          -e DB_DATABASE \
          -e XDEBUG_MODE \
          -e PHP_OPCACHE_ENABLE -e PHP_MEMORY_LIMIT -e PHP_MAX_EXECUTION_TIME \
          -v "${{ github.workspace }}:/var/www/html" \
          -w /var/www/html "${{ env.CI_IMAGE }}" \
          composer test:coverage -- --parallel

    - name: Verify external OpenAPI contract is current
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ':memory:'
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -e DB_CONNECTION \
          -e DB_DATABASE \
          -e PHP_OPCACHE_ENABLE -e PHP_MEMORY_LIMIT -e PHP_MAX_EXECUTION_TIME \
          -v "${{ github.workspace }}:/var/www/html" \
          -w /var/www/html "${{ env.CI_IMAGE }}" \
          php artisan scribe:generate --no-interaction
        git diff --exit-code -- storage/app/private/scribe/openapi.yaml

    - name: Run SvelteKit container topology smoke test
      run: .github/scripts/smoke-sveltekit-topology.sh
